name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn -B -ntp clean verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean GPG
        run: rm -rf ~/.gnupg
      
      - name: Set up JDK 21, Maven Central credentials and GPG
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Assert release tag matches project version
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Refusing to publish SNAPSHOT version: $VERSION"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Refusing to publish version $VERSION from ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}; expected tag v$VERSION"
            exit 1
          fi

      - name: Build release artifacts for packaging inspection
        run: mvn -B -ntp clean -Prelease -DskipTests verify
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Verify staged publishable artifacts
        run: bash scripts/verify-publishable-artifacts.sh

      - name: Verify generation-specific release packaging
        run: bash scripts/verify-generation-packaging.sh

      - name: Publish release to Maven Central (Sonatype Central Portal)
        run: mvn -B -ntp -Prelease -DskipTests -DautoPublish=true deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
