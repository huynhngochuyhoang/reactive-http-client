name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp clean verify

      - name: Verify generation-specific packaging
        run: bash scripts/verify-generation-packaging.sh

      - name: Verify maintenance-lane guards
        run: scripts/verify-maintenance-lane-fixtures.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk21
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7


  boot4-consumer:
    name: Boot 4 Assembled Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify current-reactor mock and assembled consumer parity
        run: scripts/verify-current-consumer.sh

      - name: Upload Boot 4 consumer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot4-current-consumer-results
          path: "target/release-evidence/current-consumer/"
          retention-days: 7


  api-compatibility:
    name: Public API Compatibility (baseline 3.6.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compare published APIs to 3.6.0
        run: |
          test ! -e target/published-baseline-repositories/api-root-3.6.0 && \
          mvn -B -ntp -s .mvn/maven-central-settings.xml \
            -Dmaven.repo.local=target/published-baseline-repositories/api-root-3.6.0 \
            -Papi-compatibility -DskipTests verify && \
          scripts/verify-published-baseline-provenance.sh api-root 3.6.0 \
            target/release-evidence/published-baselines/api-root-3.6.0 \
            reactive-http-client reactive-http-client-starter reactive-http-client-test reactive-http-client-otel

      - name: Compare starter API to 3.6.0 from a separate repository
        run: |
          test ! -e target/published-baseline-repositories/api-starter-3.6.0 && \
          mvn -B -ntp -s .mvn/maven-central-settings.xml \
            -Dmaven.repo.local=target/published-baseline-repositories/api-starter-3.6.0 \
            -pl reactive-http-client-starter \
            -Papi-compatibility -DskipTests verify && \
          scripts/verify-published-baseline-provenance.sh api-starter 3.6.0 \
            target/release-evidence/published-baselines/api-starter-3.6.0 \
            reactive-http-client-starter

      - name: Generate report-only 4.0.0 major API evidence
        if: always()
        run: |
          test ! -e target/published-baseline-repositories/api-major-report-3.6.0 && \
          mvn -B -ntp -s .mvn/maven-central-settings.xml \
            -Dmaven.repo.local=target/published-baseline-repositories/api-major-report-3.6.0 \
            -Papi-compatibility,major-api-report -DskipTests verify && \
          scripts/verify-published-baseline-provenance.sh api-major-report 3.6.0 \
            target/release-evidence/published-baselines/api-major-report-3.6.0 \
            reactive-http-client reactive-http-client-starter reactive-http-client-test reactive-http-client-otel

      - name: Verify published baseline provenance fixtures
        run: bash scripts/verify-published-baseline-fixtures.sh

      - name: Verify compatibility guard fixtures
        run: bash scripts/verify-api-compatibility-fixtures.sh

      - name: Upload API compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-compatibility-reports
          path: |
            **/target/japicmp/*
            target/release-evidence/published-baselines/api-root-3.6.0/
            target/release-evidence/published-baselines/api-starter-3.6.0/
            target/release-evidence/published-baselines/api-major-report-3.6.0/
          retention-days: 7

  release-smoke:
    name: Release Smoke (JDK ${{ matrix.java }}, Spring Boot ${{ matrix.spring-boot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21']
        spring-boot: ['4.0.0', '4.1.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run release smoke profile
        run: mvn -B -ntp -Prelease-smoke -Dspring-boot.version=${{ matrix.spring-boot }} test

      - name: Upload release smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-results-jdk${{ matrix.java }}-boot${{ matrix.spring-boot }}
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7
