name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp verify

      - name: Verify generation-specific packaging
        run: bash scripts/verify-generation-packaging.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk21
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7


  boot4-consumer:
    name: Boot 4 Assembled Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve current project version
        run: echo "PROJECT_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_ENV"

      - name: Install current Boot 4 reactor
        run: mvn -B -ntp -Dmaven.javadoc.skip=true install

      - name: Verify Boot 4 test helper
        run: mvn -B -ntp -pl reactive-http-client-test -am -Dtest=Boot4MockReactiveHttpClientTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Run assembled Boot 4 consumer
        run: mvn -B -ntp -f .github/boot4-consumer/pom.xml -Dreactive-http-client.version="$PROJECT_VERSION" test

      - name: Upload Boot 4 consumer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot4-consumer-results
          path: ".github/boot4-consumer/target/surefire-reports/*.xml"
          retention-days: 7


  api-compatibility:
    name: Public API Compatibility (baseline 2.14.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compare published APIs to 2.14.1
        run: mvn -B -ntp -Papi-compatibility,major-api-report -DskipTests verify

      - name: Verify compatibility guard fixtures
        run: bash scripts/verify-api-compatibility-fixtures.sh

      - name: Upload API compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-compatibility-reports
          path: "**/target/japicmp/*"
          retention-days: 7

  release-smoke:
    name: Release Smoke (JDK ${{ matrix.java }}, Spring Boot ${{ matrix.spring-boot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21']
        spring-boot: ['4.0.0', '4.1.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run release smoke profile
        run: mvn -B -ntp -Prelease-smoke -Dspring-boot.version=${{ matrix.spring-boot }} test

      - name: Upload release smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-results-jdk${{ matrix.java }}-boot${{ matrix.spring-boot }}
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7
