name: Published Consumer Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-consumer:
    name: Published Boot 4 Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve latest published consumer version
        run: echo "PUBLISHED_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=latest.published.version)" >> "$GITHUB_ENV"

      - name: Verify published artifacts from Maven Central
        run: |
          scripts/verify-published-release-artifacts.sh "$PUBLISHED_VERSION"
          scripts/verify-published-consumer.sh "$PUBLISHED_VERSION"

      - name: Upload published consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-consumer-${{ env.PUBLISHED_VERSION }}
          path: |
            target/release-evidence/published-consumer/published-${{ env.PUBLISHED_VERSION }}/
            target/release-evidence/published-baselines/release-artifacts-${{ env.PUBLISHED_VERSION }}/
          retention-days: 14
