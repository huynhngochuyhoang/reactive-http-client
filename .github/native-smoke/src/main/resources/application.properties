reactive.http.clients.native-smoke.auth-provider=nativeAuthProvider
reactive.http.clients.native-smoke.compression-enabled=true
reactive.http.clients.native-smoke.resilience.enabled=true
reactive.http.clients.native-smoke.cache.policies.native-cache.ttl-ms=5000
reactive.http.clients.native-smoke.cache.policies.native-cache.maximum-size=10
reactive.http.clients.native-smoke.cache.policies.native-cache.shared-response=true
reactive.http.clients.native-smoke.cache.policies.native-cache.refresh-after-ms=100
reactive.http.clients.native-smoke.cache.policies.native-cache.refresh-timeout-ms=1000
reactive.http.clients.native-smoke.cache.policies.native-query-cache.ttl-ms=5000
reactive.http.clients.native-smoke.cache.policies.native-query-cache.maximum-size=10
reactive.http.clients.native-smoke.cache.policies.native-query-cache.shared-response=true
reactive.http.clients.native-smoke.cache.policies.native-query-cache.vary-by-parameters[0]=body
reactive.http.clients.native-smoke.cache.customizations.exchangeStrategiesCustomizer=SAFE
reactive.http.clients.native-smoke.cache.customizations.webClientHttpConnectorCustomizer=SAFE
reactive.http.clients.native-smoke.cache.customizations.observationWebClientCustomizer=SAFE
reactive.http.clients.native-smoke.cache.customizations.webClientBuilder=SAFE
reactive.http.clients.native-smoke.apis.native-problem.method=GET
reactive.http.clients.native-smoke.apis.native-problem.path=/api/problem
reactive.http.observability.diagnostics-endpoint.enabled=true
